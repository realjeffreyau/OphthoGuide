name: Checks and dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install validation tools (no model runtime)
        run: python -m pip install requests==2.34.2 beautifulsoup4==4.15.0 streamlit==1.65.0 bandit==1.9.4 pip-audit==2.10.1
      - name: Validate sources and frozen artifacts
        run: |
          python scripts/validate_documents.py
          python scripts/build_test_cases.py --verify
          python scripts/verify_evaluated_snapshot.py
          python -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in [Path('app.py'), *Path('scripts').glob('*.py'), *Path('data').glob('**/src/*.py')]]"
      - name: Demo security checks without inference
        run: python scripts/test_security.py
      - name: Static security checks
        run: bandit -r app.py scripts data/training/src data/evaluation/src --severity-level medium --confidence-level medium
      - name: Audit the complete published dependency inventory
        run: pip-audit --no-deps --disable-pip -r requirements-lock.txt
      - name: Scan the complete Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
